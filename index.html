<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>动态鹈鹕测试 · Animated Pelican Benchmark</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 2px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .stage-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      background: #0f172a;
      touch-action: manipulation;
    }
    svg#stage {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }
    .panel {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(8px);
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .slider-label {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
    }
    input[type="range"] {
      flex: 1;
      height: 6px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .speed-readout {
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
      font-weight: 600;
      min-width: 96px;
      text-align: right;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button.ctrl-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(51, 65, 85, 0.75);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    button.ctrl-btn:active {
      transform: scale(0.96);
    }
    button.ctrl-btn.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: rgba(125, 211, 252, 0.45);
    }
    button.ctrl-btn.active-ik {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #6ee7b7;
      color: #ffffff;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
      padding: 0 4px;
    }
    @media (max-width: 420px) {
      .btn-grid {
        grid-template-columns: 1fr 1fr;
      }
      .btn-grid button:first-child {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">

        🚲 鹈鹕骑自行车测试

          <g id="frontWheelGroup" transform="translate(505, 232)">

          <path id="bikeChain" d="M 245,220 L 355,213 A 21,21 0 1,1 355,255 L 245,244 A 12,12 0 1,1 245,220 Z" fill="none" stroke="#334155" stroke-width="3.2" stroke-dasharray="5 3.5" />

          <g stroke="url(#frameGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">

          <path d="M 469,152 Q 483,192 505,232" fill="none" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round" />

              <path id="headCrest" d="M -10,-6 Q -26,-14 -30,-6 Q -22,-3 -14,-1 Q -25,1 -26,7 Q -16,5 -10,3 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />

              <path id="pouchFold1" d="" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.55" />
              <path id="pouchFold2" d="" fill="none" stroke="#d97706" stroke-width="1.1" opacity="0.45" />
              <g id="upperBeakGroup">

            <circle cx="245" cy="232" r="56" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="4 4" />

    <!-- 触控面板 -->
    <div class="panel">
      <div class="slider-row">

        <span id="speedReadout" class="speed-readout">1.2x · 22 km/h</span>
      </div>
      <div class="btn-grid">
        <button id="btnFeed" type="button" class="ctrl-btn primary">🐟 投喂小鱼</button>
        <button id="btnIK" type="button" class="ctrl-btn">📐 IK 骨骼透视</button>
        <button id="btnScene" type="button" class="ctrl-btn">🌅 切换晚霞</button>
      </div>
    </div>

    <div class="footer">
      <span>点按画面可按响车铃 🔔 · 纯 SVG 矢量与逆运动学实时渲染</span>
      <span>Pelican Benchmark</span>
    </div>
  </div>

  <script>
    (function () {
      function buildSpokes(groupId) {
        const g = document.getElementById(groupId);
        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI) / 6;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', (6 * Math.cos(angle)).toFixed(1));
          line.setAttribute('y1', (6 * Math.sin(angle)).toFixed(1));
          line.setAttribute('x2', (49 * Math.cos(angle)).toFixed(1));
          line.setAttribute('y2', (49 * Math.sin(angle)).toFixed(1));
          g.appendChild(line);
        }
      }
      buildSpokes('rearSpokes');
      buildSpokes('frontSpokes');

      const wavesLayer = document.getElementById('wavesLayer');
      const waveSeeds = [
        { x: 40, y: 234, w: 32 }, { x: 160, y: 250, w: 44 }, { x: 290, y: 239, w: 28 },
        { x: 420, y: 256, w: 48 }, { x: 550, y: 236, w: 36 }, { x: 670, y: 251, w: 40 }
      ];
      waveSeeds.forEach((w) => {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', w.x);
        l.setAttribute('y1', w.y);
        l.setAttribute('x2', w.x + w.w);
        l.setAttribute('y2', w.y);
        wavesLayer.appendChild(l);
      });

      const postsLayer = document.getElementById('postsLayer');
      const postPositions = [];
      for (let x = 0; x < 840; x += 84) {
        postPositions.push(x);
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', '252');
        rect.setAttribute('width', '7');
        rect.setAttribute('height', '18');
        rect.setAttribute('rx', '2');
        rect.setAttribute('fill', '#cbd5e1');
        postsLayer.appendChild(rect);
      }

      const speedLinesGroup = document.getElementById('speedLines');
      const windLines = [
        { x: 180, y: 75, len: 55 },
        { x: 140, y: 135, len: 75 },
        { x: 195, y: 190, len: 48 },
        { x: 540, y: 55, len: 62 }
      ];
      windLines.forEach((wl) => {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', wl.x);
        l.setAttribute('y1', wl.y);
        l.setAttribute('x2', wl.x + wl.len);
        l.setAttribute('y2', wl.y);
        speedLinesGroup.appendChild(l);
      });

      function solveIK(x1, y1, x2, y2, L1, L2, bendDir) {
        let dx = x2 - x1;
        let dy = y2 - y1;
        let dist = Math.hypot(dx, dy) || 0.001;
        const maxReach = L1 + L2 - 0.5;
        const minReach = Math.abs(L1 - L2) + 0.5;
        if (dist > maxReach) {
          dx = (dx / dist) * maxReach;
          dy = (dy / dist) * maxReach;
          dist = maxReach;
        } else if (dist < minReach) {
          dist = minReach;
        }
        const cosAlpha = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));
        const baseAngle = Math.atan2(dy, dx);
        const jointAngle = baseAngle + bendDir * alpha;
        return {
          jx: x1 + L1 * Math.cos(jointAngle),
          jy: y1 + L1 * Math.sin(jointAngle)
        };
      }

      let speedMult = 1.2;
      let crankAngle = 0.4;
      let wheelAngle = 0;
      let groundDist = 0;
      let cloudOffset = 0;
      let showIK = false;
      let isSunset = false;
      let fishEaten = 1;
      let gulpTimer = 0;
      let happyEyeTimer = 0;
      let blinkTimer = 2.5;
      const flyingFishes = [];
      const bellWaves = [];

      const el = {
        speedSlider: document.getElementById('speedSlider'),
        speedReadout: document.getElementById('speedReadout'),
        btnFeed: document.getElementById('btnFeed'),
        btnIK: document.getElementById('btnIK'),
        btnScene: document.getElementById('btnScene'),
        stage: document.getElementById('stage'),
        skyRect: document.getElementById('skyRect'),
        seaRect: document.getElementById('seaRect'),
        sunOrb: document.getElementById('sunOrb'),
        sunGlow: document.getElementById('sunGlow'),
        roadDash: document.getElementById('roadDash'),
        bikeShadow: document.getElementById('bikeShadow'),
        rearWheelSpin: document.getElementById('rearWheelSpin'),
        frontWheelSpin: document.getElementById('frontWheelSpin'),
        chainringSpokes: document.getElementById('chainringSpokes'),
        bikeChain: document.getElementById('bikeChain'),
        crankL: document.getElementById('crankL'),
        crankR: document.getElementById('crankR'),
        pedalL: document.getElementById('pedalL'),
        pedalR: document.getElementById('pedalR'),
        thighL: document.getElementById('thighL'),
        shinL: document.getElementById('shinL'),
        footL: document.getElementById('footL'),
        thighR: document.getElementById('thighR'),
        shinR: document.getElementById('shinR'),
        kneeCapR: document.getElementById('kneeCapR'),
        hipFeatherR: document.getElementById('hipFeatherR'),
        footR: document.getElementById('footR'),
        leftWing: document.getElementById('leftWing'),
        rightWingWhite: document.getElementById('rightWingWhite'),
        rightWingTips: document.getElementById('rightWingTips'),
        pelicanBodyGroup: document.getElementById('pelicanBodyGroup'),
        headCrest: document.getElementById('headCrest'),
        gularPouch: document.getElementById('gularPouch'),
        pouchFold1: document.getElementById('pouchFold1'),
        pouchFold2: document.getElementById('pouchFold2'),
        pouchFishSilhouette: document.getElementById('pouchFishSilhouette'),
        upperBeakGroup: document.getElementById('upperBeakGroup'),
        eyeNormal: document.getElementById('eyeNormal'),
        eyeHappy: document.getElementById('eyeHappy'),
        flyingFishLayer: document.getElementById('flyingFishLayer'),
        bellRings: document.getElementById('bellRings'),
        ikOverlay: document.getElementById('ikOverlay'),
        ikLegL: document.getElementById('ikLegL'),
        ikLegR: document.getElementById('ikLegR'),
        ikWingR: document.getElementById('ikWingR'),
        ikNodes: document.getElementById('ikNodes'),
        hudPedal: document.getElementById('hudPedal'),
        hudKnee: document.getElementById('hudKnee'),
        fishCounter: document.getElementById('fishCounter'),
        cloudsLayer: document.getElementById('cloudsLayer')
      };

      el.speedSlider.addEventListener('input', (e) => {
        speedMult = parseFloat(e.target.value);
        const kmh = Math.round(speedMult * 18.5);
        el.speedReadout.textContent = `${speedMult.toFixed(1)}x · ${kmh} km/h`;
      });

      function spawnFish() {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.innerHTML = `
          <ellipse cx="0" cy="0" rx="13" ry="5.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2" />
          <path d="M -6,-2 Q 2,-4 8,-1" fill="none" stroke="#bae6fd" stroke-width="1.2" />
          <polygon points="12,0 19,-5.5 19,5.5" fill="#0ea5e9" />
          <circle cx="-7" cy="-1" r="1.3" fill="#0f172a" />
        `;
        el.flyingFishLayer.appendChild(g);
        flyingFishes.push({
          node: g,
          t: 0,
          startX: 735,
          startY: 115 + (Math.random() - 0.5) * 40
        });
      }

      function ringBell(cx = 461, cy = 84) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cx);
        c.setAttribute('cy', cy);
        c.setAttribute('r', '6');
        c.setAttribute('fill', 'none');
        c.setAttribute('stroke', '#fde047');
        c.setAttribute('stroke-width', '2.5');
        el.bellRings.appendChild(c);
        bellWaves.push({ node: c, t: 0 });
      }

      el.btnFeed.addEventListener('click', spawnFish);

      el.btnIK.addEventListener('click', () => {
        showIK = !showIK;
        el.ikOverlay.setAttribute('display', showIK ? 'inline' : 'none');
        el.btnIK.classList.toggle('active-ik', showIK);
      });

      el.btnScene.addEventListener('click', () => {
        isSunset = !isSunset;
        el.skyRect.setAttribute('fill', isSunset ? 'url(#skySunset)' : 'url(#skyDay)');
        el.seaRect.setAttribute('fill', isSunset ? 'url(#seaSunset)' : 'url(#seaDay)');
        el.sunOrb.setAttribute('cy', isSunset ? '182' : '68');
        el.sunOrb.setAttribute('fill', isSunset ? '#fb923c' : '#fef08a');
        el.sunGlow.setAttribute('cy', isSunset ? '182' : '68');
        el.sunGlow.setAttribute('r', isSunset ? '62' : '44');
        el.btnScene.textContent = isSunset ? '🌤️ 切换日昼' : '🌅 切换晚霞';
      });

      el.stage.addEventListener('click', () => ringBell(461, 84));

      function makeFootPath(px, py, ankleOffsetY) {
        const ax = px - 4;
        const ay = py + ankleOffsetY;
        return `M ${ax.toFixed(1)},${ay.toFixed(1)} L ${(px - 10).toFixed(1)},${(py - 1).toFixed(1)} L ${(px + 14).toFixed(1)},${(py - 1).toFixed(1)} Q ${(px + 16).toFixed(1)},${(py - 5).toFixed(1)} ${(px + 4).toFixed(1)},${(py - 6).toFixed(1)} Z`;
      }

      const BB = { x: 355, y: 234 };
      const R_CRANK = 28;
      const R_WHEEL = 56;
      const GEAR_RATIO = 1.75;
      const LEG_L1 = 75;
      const LEG_L2 = 75;
      const GRIP_R = { x: 436, y: 104 };
      const GRIP_L = { x: 443, y: 96 };

      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        const omegaCrank = speedMult * 3.8;
        const dCrank = omegaCrank * dt;
        crankAngle = (crankAngle + dCrank) % (Math.PI * 2);

        const dWheel = dCrank * GEAR_RATIO;
        wheelAngle = (wheelAngle + dWheel) % (Math.PI * 2);
        groundDist += dWheel * R_WHEEL;

        const wheelDeg = (wheelAngle * 180) / Math.PI;
        el.rearWheelSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
        el.frontWheelSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(1)})`);
        el.chainringSpokes.setAttribute('transform', `rotate(${((crankAngle * 180) / Math.PI).toFixed(1)})`);
        el.bikeChain.setAttribute('stroke-dashoffset', (-(groundDist * 0.38) % 85).toFixed(1));
        el.roadDash.setAttribute('stroke-dashoffset', (groundDist % 64).toFixed(1));

        const postNodes = postsLayer.children;
        for (let i = 0; i < postNodes.length; i++) {
          let px = (postPositions[i] - groundDist * 0.55) % 840;
          if (px < -20) px += 840;
          postNodes[i].setAttribute('x', px.toFixed(1));
        }
        const waveNodes = wavesLayer.children;
        for (let i = 0; i < waveNodes.length; i++) {
          let wx = (waveSeeds[i].x - groundDist * 0.22) % 780;
          if (wx < -50) wx += 780;
          waveNodes[i].setAttribute('x1', wx.toFixed(1));
          waveNodes[i].setAttribute('x2', (wx + waveSeeds[i].w).toFixed(1));
        }
        cloudOffset = (cloudOffset + dt * (4 + speedMult * 8)) % 820;
        el.cloudsLayer.setAttribute('transform', `translate(${(-cloudOffset * 0.15).toFixed(1)}, 0)`);

        const pxR = BB.x + R_CRANK * Math.cos(crankAngle);
        const pyR = BB.y + R_CRANK * Math.sin(crankAngle);
        const pxL = BB.x + R_CRANK * Math.cos(crankAngle + Math.PI);
        const pyL = BB.y + R_CRANK * Math.sin(crankAngle + Math.PI);

        el.crankR.setAttribute('x2', pxR.toFixed(1));
        el.crankR.setAttribute('y2', pyR.toFixed(1));
        el.pedalR.setAttribute('x1', (pxR - 11).toFixed(1));
        el.pedalR.setAttribute('y1', pyR.toFixed(1));
        el.pedalR.setAttribute('x2', (pxR + 13).toFixed(1));
        el.pedalR.setAttribute('y2', pyR.toFixed(1));

        el.crankL.setAttribute('x2', pxL.toFixed(1));
        el.crankL.setAttribute('y2', pyL.toFixed(1));
        el.pedalL.setAttribute('x1', (pxL - 10).toFixed(1));
        el.pedalL.setAttribute('y1', pyL.toFixed(1));
        el.pedalL.setAttribute('x2', (pxL + 12).toFixed(1));
        el.pedalL.setAttribute('y2', pyL.toFixed(1));

        const bobY = Math.sin(crankAngle * 2) * (2.6 + speedMult * 0.9);
        const aeroPitch = Math.min(6.5, speedMult * 2.2) + Math.cos(crankAngle * 2) * 1.1;
        el.pelicanBodyGroup.setAttribute(
          'transform',
          `translate(0, ${bobY.toFixed(2)}) rotate(${aeroPitch.toFixed(2)}, 315, 122)`
        );
        el.bikeShadow.setAttribute('rx', (158 - bobY * 1.5).toFixed(1));

        const hipR = { x: 314 + aeroPitch * 0.4, y: 132 + bobY };
        const hipL = { x: 320 + aeroPitch * 0.4, y: 130 + bobY };

        const targetR = { x: pxR - 2, y: pyR - 4 };
        const targetL = { x: pxL - 2, y: pyL - 4 };
        const ikR = solveIK(hipR.x, hipR.y, targetR.x, targetR.y, LEG_L1, LEG_L2, -1);
        const ikL = solveIK(hipL.x, hipL.y, targetL.x, targetL.y, LEG_L1, LEG_L2, -1);

        el.thighR.setAttribute('x1', hipR.x.toFixed(1));
        el.thighR.setAttribute('y1', hipR.y.toFixed(1));
        el.thighR.setAttribute('x2', ikR.jx.toFixed(1));
        el.thighR.setAttribute('y2', ikR.jy.toFixed(1));
        el.shinR.setAttribute('x1', ikR.jx.toFixed(1));
        el.shinR.setAttribute('y1', ikR.jy.toFixed(1));
        el.shinR.setAttribute('x2', targetR.x.toFixed(1));
        el.shinR.setAttribute('y2', targetR.y.toFixed(1));
        el.kneeCapR.setAttribute('cx', ikR.jx.toFixed(1));
        el.kneeCapR.setAttribute('cy', ikR.jy.toFixed(1));
        el.hipFeatherR.setAttribute('cx', hipR.x.toFixed(1));
        el.hipFeatherR.setAttribute('cy', (hipR.y - 2).toFixed(1));
        el.footR.setAttribute('d', makeFootPath(pxR, pyR, -5));

        el.thighL.setAttribute('x1', hipL.x.toFixed(1));
        el.thighL.setAttribute('y1', hipL.y.toFixed(1));
        el.thighL.setAttribute('x2', ikL.jx.toFixed(1));
        el.thighL.setAttribute('y2', ikL.jy.toFixed(1));
        el.shinL.setAttribute('x1', ikL.jx.toFixed(1));
        el.shinL.setAttribute('y1', ikL.jy.toFixed(1));
        el.shinL.setAttribute('x2', targetL.x.toFixed(1));
        el.shinL.setAttribute('y2', targetL.y.toFixed(1));
        el.footL.setAttribute('d', makeFootPath(pxL, pyL, -4));

        const shoulderR = { x: 344 + aeroPitch * 0.8, y: 106 + bobY };
        const shoulderL = { x: 352 + aeroPitch * 0.8, y: 102 + bobY };
        const wingIkR = solveIK(shoulderR.x, shoulderR.y, GRIP_R.x, GRIP_R.y, 54, 54, 1);
        const wingIkL = solveIK(shoulderL.x, shoulderL.y, GRIP_L.x, GRIP_L.y, 52, 52, 1);

        el.leftWing.setAttribute(
          'd',
          `M ${shoulderL.x.toFixed(1)},${(shoulderL.y - 6).toFixed(1)} Q ${wingIkL.jx.toFixed(1)},${(wingIkL.jy + 8).toFixed(1)} ${GRIP_L.x},${GRIP_L.y} L ${GRIP_L.x - 4},${GRIP_L.y - 6} Q ${(shoulderL.x + 36).toFixed(1)},${(shoulderL.y + 4).toFixed(1)} ${shoulderL.x.toFixed(1)},${(shoulderL.y + 8).toFixed(1)} Z`
        );

        el.rightWingWhite.setAttribute(
          'd',
          `M ${(shoulderR.x - 10).toFixed(1)},${(shoulderR.y - 8).toFixed(1)} C ${(shoulderR.x - 16).toFixed(1)},${(shoulderR.y + 18).toFixed(1)} ${(wingIkR.jx - 12).toFixed(1)},${(wingIkR.jy + 10).toFixed(1)} ${wingIkR.jx.toFixed(1)},${(wingIkR.jy + 4).toFixed(1)} L ${(GRIP_R.x - 14).toFixed(1)},${(GRIP_R.y + 5).toFixed(1)} L ${(GRIP_R.x - 18).toFixed(1)},${(GRIP_R.y - 4).toFixed(1)} Q ${wingIkR.jx.toFixed(1)},${(wingIkR.jy - 10).toFixed(1)} ${(shoulderR.x + 12).toFixed(1)},${(shoulderR.y - 6).toFixed(1)} Z`
        );
        el.rightWingTips.setAttribute(
          'd',
          `M ${(GRIP_R.x - 19).toFixed(1)},${(GRIP_R.y - 4).toFixed(1)} L ${(GRIP_R.x + 4).toFixed(1)},${(GRIP_R.y - 3).toFixed(1)} Q ${(GRIP_R.x + 8).toFixed(1)},${(GRIP_R.y + 3).toFixed(1)} ${(GRIP_R.x + 2).toFixed(1)},${(GRIP_R.y + 7).toFixed(1)} L ${(GRIP_R.x - 15).toFixed(1)},${(GRIP_R.y + 6).toFixed(1)} Z`
        );

        let mouthOpenRatio = 0;
        const mouthWorldX = 468 + aeroPitch * 1.2;
        const mouthWorldY = 54 + bobY;

        for (let i = flyingFishes.length - 1; i >= 0; i--) {
          const f = flyingFishes[i];
          f.t += dt * 1.25;
          if (f.t >= 1) {
            f.node.remove();
            flyingFishes.splice(i, 1);
            gulpTimer = 1.1;
            happyEyeTimer = 1.1;
            fishEaten++;
            el.fishCounter.textContent = `已捕食: ${fishEaten} 条鱼`;
            continue;
          }
          const u = f.t;
          const fx = f.startX + (mouthWorldX - f.startX) * u;
          const arcY = -95 * 4 * u * (1 - u);
          const fy = f.startY + (mouthWorldY - f.startY) * u + arcY;
          const nextU = Math.min(1, u + 0.02);
          const nfx = f.startX + (mouthWorldX - f.startX) * nextU;
          const nfy = f.startY + (mouthWorldY - f.startY) * nextU - 95 * 4 * nextU * (1 - nextU);
          const rotDeg = (Math.atan2(nfy - fy, nfx - fx) * 180) / Math.PI + 180;
          f.node.setAttribute('transform', `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${rotDeg.toFixed(1)})`);

          if (u > 0.35) {
            const openCurve = Math.sin(((u - 0.35) / 0.65) * Math.PI);
            mouthOpenRatio = Math.max(mouthOpenRatio, openCurve);
          }
        }

        if (gulpTimer > 0) gulpTimer = Math.max(0, gulpTimer - dt);

        const lagBounce = Math.sin(crankAngle * 2 - 0.85) * (3.2 + speedMult * 1.4);
        const gulpBulge = gulpTimer > 0 ? Math.sin(gulpTimer * 16) * 7 * gulpTimer + 11 * gulpTimer : 0;
        const pouchDrop = 40 + lagBounce + mouthOpenRatio * 18 + gulpBulge;

        el.gularPouch.setAttribute('d', `M 6,3 C 14,${(pouchDrop * 0.95).toFixed(1)} 56,${(pouchDrop * 1.18).toFixed(1)} 98,4 Z`);
        el.pouchFold1.setAttribute('d', `M 16,5 Q 44,${(pouchDrop * 0.72).toFixed(1)} 82,4`);
        el.pouchFold2.setAttribute('d', `M 26,5 Q 52,${(pouchDrop * 0.45).toFixed(1)} 72,4`);
        el.pouchFishSilhouette.setAttribute(
          'transform',
          `translate(45, ${(14 + lagBounce * 0.4 + gulpBulge * 0.35).toFixed(1)}) rotate(${(6 + lagBounce).toFixed(1)})`
        );

        const beakLiftDeg = -mouthOpenRatio * 17;
        el.upperBeakGroup.setAttribute('transform', `rotate(${beakLiftDeg.toFixed(1)}, 12, 0)`);
        const crestWave = Math.sin(now * 0.012) * (2 + speedMult * 2.5);
        el.headCrest.setAttribute('transform', `rotate(${(-speedMult * 4 + crestWave).toFixed(1)}, -10, 0)`);

        if (happyEyeTimer > 0) {
          happyEyeTimer -= dt;
          el.eyeNormal.setAttribute('display', 'none');
          el.eyeHappy.setAttribute('display', 'inline');
        } else {
          blinkTimer -= dt;
          if (blinkTimer <= 0) blinkTimer = 3.2 + Math.random() * 2.5;
          const isBlinking = blinkTimer < 0.13;
          el.eyeNormal.setAttribute('display', isBlinking ? 'none' : 'inline');
          el.eyeHappy.setAttribute('display', isBlinking ? 'inline' : 'none');
        }

        const windOpacity = speedMult > 1.5 ? Math.min(0.75, (speedMult - 1.5) * 0.5) : 0;
        speedLinesGroup.setAttribute('opacity', windOpacity.toFixed(2));
        if (windOpacity > 0) {
          const wChildren = speedLinesGroup.children;
          for (let i = 0; i < wChildren.length; i++) {
            const shift = ((now * 0.45 * speedMult + i * 190) % 760);
            const xPos = 720 - shift;
            wChildren[i].setAttribute('x1', xPos.toFixed(1));
            wChildren[i].setAttribute('x2', (xPos + windLines[i].len).toFixed(1));
          }
        }

        for (let i = bellWaves.length - 1; i >= 0; i--) {
          const bw = bellWaves[i];
          bw.t += dt * 2.2;
          if (bw.t >= 1) {
            bw.node.remove();
            bellWaves.splice(i, 1);
            continue;
          }
          bw.node.setAttribute('r', (6 + bw.t * 28).toFixed(1));
          bw.node.setAttribute('opacity', (1 - bw.t).toFixed(2));
        }

        if (showIK) {
          el.ikLegL.setAttribute(
            'points',
            `${hipL.x.toFixed(1)},${hipL.y.toFixed(1)} ${ikL.jx.toFixed(1)},${ikL.jy.toFixed(1)} ${targetL.x.toFixed(1)},${targetL.y.toFixed(1)}`
          );
          el.ikLegR.setAttribute(
            'points',
            `${hipR.x.toFixed(1)},${hipR.y.toFixed(1)} ${ikR.jx.toFixed(1)},${ikR.jy.toFixed(1)} ${targetR.x.toFixed(1)},${targetR.y.toFixed(1)}`
          );
          el.ikWingR.setAttribute(
            'points',
            `${shoulderR.x.toFixed(1)},${shoulderR.y.toFixed(1)} ${wingIkR.jx.toFixed(1)},${wingIkR.jy.toFixed(1)} ${GRIP_R.x},${GRIP_R.y}`
          );

          const pts = [
            { x: hipR.x, y: hipR.y, c: '#4ade80' },
            { x: ikR.jx, y: ikR.jy, c: '#4ade80' },
            { x: targetR.x, y: targetR.y, c: '#facc15' },
            { x: BB.x, y: BB.y, c: '#facc15' },
            { x: shoulderR.x, y: shoulderR.y, c: '#c084fc' },
            { x: wingIkR.jx, y: wingIkR.jy, c: '#c084fc' },
            { x: GRIP_R.x, y: GRIP_R.y, c: '#c084fc' }
          ];
          el.ikNodes.innerHTML = pts
            .map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${p.c}" stroke="#0f172a" stroke-width="1.2"/>`)
            .join('');

          const deg = Math.round((crankAngle * 180) / Math.PI);
          el.hudPedal.textContent = `PedalR : (${Math.round(pxR)}, ${Math.round(pyR)}) θ=${deg}°`;
          el.hudKnee.textContent = `KneeR  : (${Math.round(ikR.jx)}, ${Math.round(ikR.jy)}) L=75+75`;
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
      setTimeout(spawnFish, 700);
    })();
  </script>
</body>
</html>
